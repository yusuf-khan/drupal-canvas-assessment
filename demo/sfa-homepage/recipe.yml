name: Specialty Food demo page
description: Imports the published Winter FancyFaire Canvas page and its media.
type: Content
install:
  - canvas_full_html
  - sfa_theme
config:
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: /winter-fancyfaire
    user.role.content_editor:
      grantPermissions:
        - 'publish auto-saves'
        - 'use text format canvas_full_html'
