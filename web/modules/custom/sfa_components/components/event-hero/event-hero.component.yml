$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Event hero
status: stable
group: Specialty Food
description: Promote an event with full-width photography and up to two calls to action.
libraryOverrides:
  dependencies:
    - sfa_components/design
props:
  type: object
  required: [heading]
  properties:
    eyebrow:
      type: string
      title: Eyebrow
      examples: ["People. Products. A brighter food future."]
    heading:
      type: string
      title: Heading
      examples: [Winter]
    heading_second_line:
      type: string
      title: Heading second line
      examples: ["FancyFaire* 2028"]
    heading_level:
      type: string
      title: Heading level
      enum: [h1, h2]
      examples: [h1]
    summary:
      type: string
      title: Summary
      examples: ["Join the specialty food community to kick off 2027 in one of the world's great food cities: San Francisco. Elevate your trade show experience with offsite sampling, unstructured networking, and local immersion."]
    photo:
      type: object
      title: Decorative hero photo
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: assets/home-hero-food.png
          alt: "Assorted cheeses, fruit, olives and bread"
          width: 1672
          height: 941
    event_date:
      type: string
      title: Event date
      examples: ["January 17–19, 2027"]
    venue:
      type: string
      title: Venue
      examples: ["Moscone Center"]
    city:
      type: string
      title: City
      examples: ["San Francisco, CA"]
    secondary_label:
      type: string
      title: Outline button label
      examples: ["Register to Attend"]
    secondary_url:
      type: string
      title: Outline button URL
      format: uri-reference
      examples: ["#registration"]
    primary_label:
      type: string
      title: Filled button label
      examples: ["Explore the Event"]
    primary_url:
      type: string
      title: Filled button URL
      format: uri-reference
      examples: ["#resources"]
