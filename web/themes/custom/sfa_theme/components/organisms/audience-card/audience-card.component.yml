$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Audience card
status: stable
group: Specialty Food
description: Show a photo, audience description and resource link, with an optional icon.
libraryOverrides:
  dependencies:
    - sfa_theme/design
props:
  type: object
  required: [heading]
  properties:
    background:
      type: string
      title: Background color
      enum: [white, cream, banana]
      meta:enum:
        white: White
        cream: Cream
        banana: Banana
      examples: [white]
    photo:
      type: object
      title: Card photo
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: assets/maker.png
          alt: "Hands preparing a spread with crackers and vegetables"
          width: 1672
          height: 941
    icon:
      type: object
      title: Decorative badge icon
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: assets/icon-maker.png
          alt: "Sprouting leaves"
          width: 1254
          height: 1254
    heading:
      type: string
      title: Heading
      examples: ["I'm a Maker"]
    heading_level:
      type: string
      title: Heading level
      enum: [h2, h3]
      examples: [h2]
    formatted_heading:
      type: string
      title: Formatted heading
      contentMediaType: text/html
      x-formatting-context: block
    formatted_summary:
      type: string
      title: Formatted description
      contentMediaType: text/html
      x-formatting-context: block
    summary:
      type: string
      title: Summary
      examples: ["Grow your brand and reach new markets."]
    link_label:
      type: string
      title: Link label
      examples: ["See resources for makers"]
    link_url:
      type: string
      title: Link URL
      format: uri-reference
      examples: ["#makers"]
