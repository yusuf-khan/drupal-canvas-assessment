$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Card group
status: stable
group: Specialty Food
description: Arrange cards in a responsive grid with an editable desktop column count.
libraryOverrides:
  dependencies:
    - sfa_theme/design
props:
  type: object
  properties:
    columns:
      type: string
      title: Items across on desktop
      enum: [two, three, four]
      meta:enum:
        two: Two
        three: Three
        four: Four
      examples: [four]
    background:
      type: string
      title: Background color
      enum: [white, cream, banana]
      meta:enum:
        white: White
        cream: Cream
        banana: Banana
      examples: [white]
    anchor:
      type: string
      title: Section anchor without #
      examples: ["resources"]
slots:
  cards:
    title: Cards
    description: Add, duplicate and reorder Audience cards here.
